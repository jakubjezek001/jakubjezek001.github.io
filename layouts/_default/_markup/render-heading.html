{{- /* The "#" is drawn by CSS (.heading-anchor::after) so it never shows up in summaries, RSS or word counts. */ -}}
<h{{ .Level }} id="{{ .Anchor }}"{{ with .Attributes.class }} class="{{ . }}"{{ end }}>{{ .Text }}{{ if ge .Level 2 }}<a class="heading-anchor" href="#{{ .Anchor }}" aria-label="Link to this section"></a>{{ end }}</h{{ .Level }}>
